[package]
name = "nirudrums"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "NIRUDRUMS vintage drum machine VST3 and standalone"

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name = "nirudrums"
path = "src/main.rs"

[dependencies]
nirudrums-core = { path = "../nirudrums-core" }
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683", features = ["standalone"] }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
crossbeam-queue = "0.3"
hound = "3.5"
x11rb = "0.13"
