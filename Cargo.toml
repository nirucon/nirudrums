[workspace]
resolver = "2"
members = [
    "crates/nirudrums-core",
    "crates/nirudrums-plugin",
    "xtask",
]

[workspace.package]
version = "0.0.2"
edition = "2021"
rust-version = "1.80"
license = "GPL-3.0-or-later"
authors = ["Nicklas Rudolfsson"]

[profile.release]
lto = true
codegen-units = 1
strip = true
